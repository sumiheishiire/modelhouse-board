name: update-data
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 JST 6:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: スプレッドシートを取得
        run: curl -fsSL "https://docs.google.com/spreadsheets/d/1YvZ4Eb6Z9qbGgQPb-t02uCElwJIKTtPS7oq-yKESqSc/gviz/tq?tqx=out:csv" -o gviz.csv
      - name: 個人情報を除いて data.json を作成
        run: node scripts/build_data.js gviz.csv
      - name: 変更をコミット
        run: |
          rm -f gviz.csv
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "data: 自動更新" || exit 0
          git push
